name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build + testes + validate (2 seeds)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (raylib 5.5 via FetchContent)
        run: cmake -B build -A x64

      - name: Build Release (darknet + testes)
        run: cmake --build build --config Release --target darknet darknet_tests

      - name: Build Debug (darknet)
        run: cmake --build build --config Debug --target darknet

      - name: Testes unitarios (doctest 12 casos / 109 asserts)
        run: build\Release\darknet_tests.exe

      - name: Validate seed 7 (bot 120s) - portao do ciclo
        shell: bash
        run: |
          cd build/Release
          ./darknet.exe --autotest --test-seconds=120 --seed=7 > validate.log 2>&1
          code=$?
          grep -E "VALIDACAO|FASES:|POSTFX|WORLDLIT" validate.log | head -20
          test "$code" -eq 0
          test "$(grep -c 'VALIDACAO: PASSOU' validate.log)" -ge 1

      - name: Validate seed 20260821 (bot 120s) - portao do ciclo
        shell: bash
        run: |
          cd build/Release
          ./darknet.exe --autotest --test-seconds=120 --seed=20260821 > validate2.log 2>&1
          code=$?
          grep -E "VALIDACAO|FASES:|POSTFX|WORLDLIT" validate2.log | head -20
          test "$code" -eq 0
          test "$(grep -c 'VALIDACAO: PASSOU' validate2.log)" -ge 1