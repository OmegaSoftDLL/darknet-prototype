# ─────────────────────────────────────────────────────────────────────────────
# DARKNET — CYBER STATION (servidor do jogo)
# Orquestra os containers do backend: gateway, game-server e banco.
#   docker compose up -d
#
# NOTA: não há container Redis. O matchmaking/salas são um Map em memória no
# game-server (suficiente para o estágio atual). Reintroduza Redis (serviço
# `cache` + REDIS_URL) apenas quando houver necessidade real: sessões
# distribuídas ou múltiplas instâncias do game-server atrás de load balancer.
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  # API gateway / reverse proxy (TLS termina aqui em produção)
  gateway:
    image: nginx:1.27-alpine
    container_name: cyber-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - game-server
    restart: unless-stopped

  # Servidor do jogo: auth, loja, inventário, realtime (WebSocket) e matchmaking
  game-server:
    build: ./game-server
    container_name: cyber-game-server
    environment:
      PORT: "9000"
      DATABASE_URL: "postgres://darknet:darknet@db:5432/darknet"
      JWT_SECRET: "${JWT_SECRET:-troque-em-producao}"
      # URL pública usada nos success/cancel do Stripe Checkout — porta do
      # gateway (8080), não a interna do app (9000).
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8080}"
      # Pagamentos: preencha com SUA conta Stripe (NUNCA commitar chaves reais)
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    depends_on:
      - db
    restart: unless-stopped

  # Banco de dados: contas, inventário, transações, progresso
  db:
    image: postgres:16-alpine
    container_name: cyber-db
    environment:
      POSTGRES_USER: darknet
      POSTGRES_PASSWORD: darknet
      POSTGRES_DB: darknet
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  dbdata:
