# ─────────────────────────────────────────────────────────────────────────────
# DARKNET — CYBER STATION (game server)
# Orchestrates the backend containers: gateway, game-server and database.
#   docker compose up -d
#
# NOTE: there is no Redis container. Matchmaking/rooms are kept in an in-memory
# Map inside the game-server (enough for the current stage). Reintroduce Redis
# (a `cache` service + REDIS_URL) only when there is a real need: distributed
# sessions or multiple game-server instances behind a load balancer.
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  # API gateway / reverse proxy (TLS terminates here in production)
  gateway:
    image: nginx:1.27-alpine
    container_name: cyber-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - game-server
    restart: unless-stopped

  # Game server: auth, store, inventory, realtime (WebSocket) and matchmaking
  game-server:
    build: ./game-server
    container_name: cyber-game-server
    environment:
      PORT: "9000"
      DATABASE_URL: "postgres://darknet:darknet@db:5432/darknet"
      # REQUIRED: without JWT_SECRET the compose ABORTS (explicit fail-safe
      # instead of starting with a known hard-coded secret). Generate one with:
      #   openssl rand -hex 48
      # Never use a fixed default — a known "dev-secret" allows forging tokens
      # for any player. Set it in .env (or export in the shell).
      JWT_SECRET: "${JWT_SECRET:?define JWT_SECRET in environment/.env (e.g.: openssl rand -hex 48)}"
      # Public URL used in Stripe Checkout success/cancel — use the gateway port
      # (8080), not the internal app port (9000). With TLS on the gateway, use
      # https:// (e.g.: https://darknet.yourdomain.com).
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8080}"
      # Payments: fill with YOUR Stripe account (NEVER commit real keys)
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    depends_on:
      - db
    restart: unless-stopped

  # Database: accounts, inventory, transactions, progress
  db:
    image: postgres:16-alpine
    container_name: cyber-db
    environment:
      POSTGRES_USER: darknet
      POSTGRES_PASSWORD: darknet
      POSTGRES_DB: darknet
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  dbdata:
