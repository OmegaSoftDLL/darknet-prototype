# ─────────────────────────────────────────────────────────────────────────────
# DARKNET — CYBER STATION gateway nginx.
# REST via /api/* (rate limit), realtime via /ws (Upgrade + Authorization).
# O game-server (9000) fica internamente na rede docker em HTTP; o TLS termina
# AQUI (no gateway). Para ativar HTTPS descomente o bloco `server` de 443 abaixo
# e monte os certificados em /etc/nginx/certs (volume em docker-compose.yml).
# Gere para teste/local:
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout certs/server.key -out certs/server.crt -days 365 -subj "/CN=darknet"
# Em produção use um certificado real (Let's Encrypt / sua CA).
# ─────────────────────────────────────────────────────────────────────────────
events {
    worker_connections 1024;
}

http {
    # Rate limit da API: 10 req/s por IP (burst 30). O WS não passa por aqui
    # (o game-server limita mensagens por conexão).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream game { server game-server:9000; }

    server {
        listen 80;

        # Resta da API: /api/xxx -> /xxx no game-server (prefixo /api somado).
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://game/;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (realtime: posição dos jogadores, chat, matchmaking).
        # O JWT vai no header Authorization do handshake e é validado pelo
        # game-server na hora do upgrade (401 se ausente/vencido).
        location /ws {
            proxy_pass http://game/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Authorization      $http_authorization;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }
    }

    ########################################################################
    # HTTPS — DESCOMENTE para terminar TLS aqui (e ajuste o listen 80 para
    # redirecionar para 443 se quiser forçar HTTPS). Cobre TANTO /api quanto
    # /ws — o realtime vira wss:// automaticamente.
    ########################################################################
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
