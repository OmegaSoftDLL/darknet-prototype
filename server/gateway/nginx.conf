# ─────────────────────────────────────────────────────────────────────────────
# DARKNET — CYBER STATION gateway nginx.
# REST via /api/* (rate limit), realtime via /ws (Upgrade + Authorization).
# O game-server (9000) stays internamente in the network docker in HTTP; the TLS ends
# AQUI (in the gateway). Para ativar HTTPS descomente the block `server` of 443 below
# and monte the certificados in /etc/nginx/certs (volume in docker-compose.yml).
# Gere to test/local:
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout certs/server.key -out certs/server.crt -days 365 -subj "/CN=darknet"
# Em production use um certificate real (Let's Encrypt / your CA).
# ─────────────────────────────────────────────────────────────────────────────
events {
    worker_connections 1024;
}

http {
    # Rate limit of the API: 10 req/s per IP (burst 30). O WS not passes by here
    # (the game-server limits messages by connection).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream game { server game-server:9000; }

    server {
        listen 80;

        # Resta of the API: /api/xxx -> /xxx in the game-server (prefixo /api somado).
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://game/;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (realtime: position of the players, chat, matchmaking).
        # O JWT goes in the header Authorization of the handshake and is validated pelo
        # game-server in the hour of the upgrade (401 if ausente/vencido).
        location /ws {
            proxy_pass http://game/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         "upgrade";
            proxy_set_header Authorization      $http_authorization;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
        }
    }

    ########################################################################
    # HTTPS — DESCOMENTE to finish TLS here (and ajuste the listen 80 to
    # redirect to 443 if quiser force HTTPS). Cobre TANTO /api the
    # /ws — the realtime vira wss:// automaticamente.
    ########################################################################
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/ {
    #         limit_req zone=api_limit burst=30 nodelay;
    #         proxy_pass http://game/;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
